name: RSS to Discord Updater

on:
  workflow_dispatch:
    inputs:
      secret_token:
        description: 'Token de seguridad para cron-job.org'
        required: true
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write # <-- Esto permite hacer git push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token (si es workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.secret_token }}" != "${{ secrets.CRON_SECRET }}" ]; then
            echo "Token inválido" && exit 1
          fi

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DISCORD_WEBHOOK_CS2: ${{ secrets.DISCORD_WEBHOOK_CS2 }}
          DISCORD_WEBHOOK_FACEIT: ${{ secrets.DISCORD_WEBHOOK_FACEIT }}
        run: node script.js

      - name: Guardar estado (Commit de últimos vistos)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_*.txt
          git commit -m "chore: actualizar último estado de RSS" || echo "Sin cambios para commitear"
          git push
